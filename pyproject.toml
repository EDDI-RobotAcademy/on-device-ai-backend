[project]
name = "on-device-ai-backend"
version = "0.1.0"
description = "산업용 On-Device AI 시스템 Backend (교육/실습용, 산업 수준 구조)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    # -------------------------------------------------------------------
    # 실습 단위 마커.
    #   docs/curriculum/1-3.md 의 실습 결과를 확인하려면:
    #       pytest -m lesson_1_3 -v
    # -------------------------------------------------------------------
    "lesson_1_1: 데이터를 열어보는 순간 현실이 보인다",
    "lesson_1_2: CSV 하나에도 현장의 문제가 숨어 있다",
    "lesson_1_3: 데이터의 정체부터 밝혀라",
    "lesson_1_4: 센서와 이미지는 거짓말을 어떻게 하는가?",
    "lesson_1_5: 시간축을 놓치면 현장을 잃는다",
    "lesson_1_6: 정상과 이상을 누가 결정하는가?",
    "lesson_1_7: AI가 먹을 수 있는 데이터로 다시 설계하라",
    "lesson_1_8: 데이터를 쪼개야 진짜 문제가 보인다",
    "lesson_1_9: Training Data와 Reality는 왜 다른가?",
    "lesson_1_10: 학습시키기 전에 데이터부터 검증하라",
    "lesson_1_11: 수집 주기와 해상도를 직접 정하라",
    "lesson_2_1: 깨끗한 데이터부터 의심하라",
    "lesson_2_2: 결측치를 숨기면 AI가 대신 대가를 치른다",
    "lesson_2_3: 이상치는 데이터에 숨어 있는 사고다",
    "lesson_2_4: 잘못된 Label 하나가 모델 전체를 망친다",
    "lesson_2_5: 불균형 데이터는 AI의 판단을 왜곡한다",
    "lesson_2_6: Noise를 제거하지 않으면 AI가 Noise를 배운다",
    "lesson_2_7: 중복 데이터는 AI에게 같은 현실을 반복해서 가르친다",
    "lesson_2_8: 데이터 품질을 감이 아니라 숫자로 측정하라",
    "lesson_2_9: 망가진 데이터와 정상 데이터를 직접 비교하라",
    "lesson_2_10: AI를 학습시키기 전에 Data Quality Gate를 통과시켜라",
    "lesson_2_11: 불균형을 줄이는 방법마다 잃는 것이 다르다",
    "lesson_3_1: 데이터를 처음으로 AI에게 먹여보자",
    "lesson_3_2: AI가 데이터를 계산하는 과정을 직접 뜯어보자",
    "lesson_3_3: 이미지를 숫자로 바꿔라",
    "lesson_3_4: 센서의 시간을 AI가 볼 수 있게 잘라라",
    "lesson_3_5: 첫 번째 모델을 직접 학습시켜라",
    "lesson_3_6: Loss가 떨어지는 순간을 확인하라",
    "lesson_3_7: AI가 데이터를 외우기 시작하는 순간을 잡아라",
    "lesson_3_8: Training과 Validation을 분리하라",
    "lesson_3_9: Accuracy 뒤에 숨어 있는 실패를 찾아라",
    "lesson_3_10: 현장 데이터를 통과하는 모델만 살아남는다",
    "lesson_3_11: 이미지로 정상과 불량을 가르는 모델을 학습시켜라",
    "lesson_3_12: 데이터 구조를 바꾸면 모델이 달라진다",
    "lesson_3_13: 통계로 잡히는 이상을 AI라고 부르지 마라",
    "lesson_3_14: 실험을 반복하고 비교하라",
    "lesson_3_15: 데이터를 고치면 모델이 얼마나 달라지는가",
    "lesson_4_1: PC에서 돌아간다고 끝난 게 아니다",
    "lesson_4_2: PyTorch 모델을 디바이스용 모델로 바꿔라",
    "lesson_4_3: ONNX로 모델의 실행 경로를 바꿔라",
    "lesson_4_4: TFLite로 모델을 디바이스에 맞춰라",
    "lesson_4_5: FP32 모델의 무게를 직접 측정하라",
    "lesson_4_6: FP16으로 줄이고 무엇을 얻었는지 확인하라",
    "lesson_4_7: INT8로 줄이고 정확도가 얼마나 살아남는지 확인하라",
    "lesson_4_8: 정확도와 Latency를 직접 싸움 붙여라",
    "lesson_4_9: Memory와 Compute 병목을 직접 찾아라",
    "lesson_4_10: 가장 빠른 모델이 아니라 가장 쓸 수 있는 모델을 선택하라",
    "lesson_4_11: 구조를 줄이는 것과 숫자를 줄이는 것은 다르다",
    "lesson_4_12: 학습 중에 양자화를 가르쳐라",
    "lesson_4_13: CPU와 메모리를 실제로 재라",
    "lesson_4_14: 한 장씩 볼 때와 묶어서 볼 때는 다르다",
    "lesson_5_1: 모델을 처음으로 현장에 배포하라",
    "lesson_5_2: 배포된 모델에 Version을 부여하라",
    "lesson_5_3: AI의 모든 판단을 로그로 남겨라",
    "lesson_5_4: AI가 언제부터 이상해졌는지 찾아라",
    "lesson_5_5: Latency가 무너지면 무엇이 달라졌는가?",
    "lesson_5_6: Prediction Distribution의 변화를 추적하라",
    "lesson_5_7: Data Drift를 직접 찾아라",
    "lesson_5_8: 문제가 발생하면 모델을 격리하라",
    "lesson_5_9: 새 모델과 기존 모델을 실제 데이터로 비교하라",
    "lesson_5_10: 망가진 모델을 Rollback하라",
    "lesson_5_11: 재학습이 필요한 순간을 직접 정의하라",
    "lesson_5_12: 디바이스에서 도는 추론 파이프라인을 완성하라",
    "lesson_5_13: 알람이 너무 많으면 아무도 안 본다",
    "lesson_5_14: 트래픽을 나눠서 두 모델을 동시에 재라",
    "lesson_5_15: 파일로 보낼 것인가, 컨테이너로 보낼 것인가",
    "lesson_6_1: 디바이스에서 발생한 데이터를 Cloud로 보내라",
    "lesson_6_2: Edge의 데이터를 S3에 모아라",
    "lesson_6_3: 수천 개의 디바이스 데이터를 하나로 관리하라",
    "lesson_6_4: Cloud에서 다시 학습 데이터를 만들어라",
    "lesson_6_5: SageMaker에서 새로운 모델을 학습시켜라",
    "lesson_6_6: Cloud에서 만든 모델을 Edge로 보내라",
    "lesson_6_7: 모델 Version을 Cloud에서 관리하라",
    "lesson_6_8: OTA로 현장의 AI를 업데이트하라",
    "lesson_6_9: 문제가 생기면 이전 모델로 되돌려라",
    "lesson_6_10: Edge → Cloud → Edge 순환 구조를 완성하라",
    "lesson_6_11: 수천 대의 AI를 동시에 운영할 수 있는 구조를 만들어라",
    "lesson_6_12: 실험을 기록하지 않으면 다시 만들 수 없다",
    "lesson_6_13: S3에 버전과 권한을 걸어라",
    "lesson_6_14: 실시간 추론 Endpoint를 띄워라",
    "slow: 실행 시간이 긴 테스트",
]
